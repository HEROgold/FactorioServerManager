apiVersion: v1
kind: Namespace
metadata:
  name: fsm
---
# Selects the Kubernetes server-spawning backend (read by confkit AppConfig).
apiVersion: v1
kind: ConfigMap
metadata:
  name: fsm-config
  namespace: fsm
data:
  config.ini: |
    [AppConfig]
    SERVER_BACKEND = kubernetes
    K8S_NAMESPACE = fsm
    PUBLIC_IP = 127.0.0.1
    MOD_SHARED_ROOT = /mnt/mod-cache
---
# Shared, deduplicated mod store. Holds each mod+version zip once plus every
# server's hardlinked mods directory; mounted RW by the backend and per-server
# (subPath) into each Factorio pod at /factorio/mods.
# NOTE: ReadWriteOnce for the local kind/local-path provisioner (it rejects RWX).
# A real cluster with an RWX storage class (NFS/CephFS) should use ReadWriteMany
# so backend + Factorio pods can share it across nodes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fsm-mod-cache
  namespace: fsm
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fsm-backend
  namespace: fsm
---
# Lets the backend spawn Factorio servers (Deployments/Services/PVCs) in its namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fsm-backend
  namespace: fsm
rules:
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fsm-backend
  namespace: fsm
subjects:
  - kind: ServiceAccount
    name: fsm-backend
    namespace: fsm
roleRef:
  kind: Role
  name: fsm-backend
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fsm-backend
  namespace: fsm
  labels: { app: fsm-backend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: fsm-backend }
  template:
    metadata:
      labels: { app: fsm-backend }
    spec:
      serviceAccountName: fsm-backend
      containers:
        - name: backend
          image: fsm-backend:dev
          imagePullPolicy: Never
          # confkit rewrites config.ini in place at import, so copy the
          # (read-only) ConfigMap into the writable image path before launching.
          command: ["/bin/sh", "-c"]
          args:
            - cp /config/config.ini /app/src/api/config.ini &&
              exec uv run --no-sync uvicorn api.main:app --host 0.0.0.0 --port 8000
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: config
              mountPath: /config
            - name: mod-cache
              mountPath: /mnt/mod-cache
          readinessProbe:
            httpGet: { path: /openapi.json, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: fsm-config
        - name: mod-cache
          persistentVolumeClaim:
            claimName: fsm-mod-cache
---
apiVersion: v1
kind: Service
metadata:
  name: fsm-backend
  namespace: fsm
spec:
  selector: { app: fsm-backend }
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fsm-frontend
  namespace: fsm
  labels: { app: fsm-frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: fsm-frontend }
  template:
    metadata:
      labels: { app: fsm-frontend }
    spec:
      containers:
        - name: frontend
          image: fsm-frontend:dev
          imagePullPolicy: Never
          env:
            # The Bun dev server proxies /api -> this in-cluster backend service.
            - name: API_TARGET
              value: "http://fsm-backend:8000"
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: fsm-frontend
  namespace: fsm
spec:
  type: NodePort
  selector: { app: fsm-frontend }
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
