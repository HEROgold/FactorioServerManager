apiVersion: v1
kind: Namespace
metadata:
  name: fsm
---
# Selects the Kubernetes server-spawning backend (read by confkit AppConfig).
apiVersion: v1
kind: ConfigMap
metadata:
  name: fsm-config
  namespace: fsm
data:
  config.ini: |
    [AppConfig]
    SERVER_BACKEND = kubernetes
    K8S_NAMESPACE = fsm
    PUBLIC_IP = 127.0.0.1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fsm-backend
  namespace: fsm
---
# Lets the backend spawn Factorio servers (Deployments/Services/PVCs) in its namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fsm-backend
  namespace: fsm
rules:
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fsm-backend
  namespace: fsm
subjects:
  - kind: ServiceAccount
    name: fsm-backend
    namespace: fsm
roleRef:
  kind: Role
  name: fsm-backend
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fsm-backend
  namespace: fsm
  labels: { app: fsm-backend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: fsm-backend }
  template:
    metadata:
      labels: { app: fsm-backend }
    spec:
      serviceAccountName: fsm-backend
      containers:
        - name: backend
          image: fsm-backend:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: config
              mountPath: /app/src/api/config.ini
              subPath: config.ini
          readinessProbe:
            httpGet: { path: /openapi.json, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: fsm-config
---
apiVersion: v1
kind: Service
metadata:
  name: fsm-backend
  namespace: fsm
spec:
  selector: { app: fsm-backend }
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fsm-frontend
  namespace: fsm
  labels: { app: fsm-frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: fsm-frontend }
  template:
    metadata:
      labels: { app: fsm-frontend }
    spec:
      containers:
        - name: frontend
          image: fsm-frontend:dev
          imagePullPolicy: Never
          env:
            # The Bun dev server proxies /api -> this in-cluster backend service.
            - name: API_TARGET
              value: "http://fsm-backend:8000"
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: fsm-frontend
  namespace: fsm
spec:
  type: NodePort
  selector: { app: fsm-frontend }
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
