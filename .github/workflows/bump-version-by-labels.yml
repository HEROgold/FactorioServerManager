name: Bump Version By Labels

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  bump-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Determine version bump
        id: detect-bump
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$LABELS" | grep -iq "Major"; then
            echo "bump_type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -iq "Minor"; then
            echo "bump_type=minor" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -iq "Patch"; then
            echo "bump_type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "bump_type=" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        if: steps.detect-bump.outputs.bump_type != ''
        id: bump-version
        run: |
          uv version --bump ${{ steps.detect-bump.outputs.bump_type }}
          NEW_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version-bumped=true" >> "$GITHUB_OUTPUT"
          echo "new-version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create version bump PR
        if: steps.bump-version.outputs.version-bumped == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          BRANCH_NAME="bump-version-${{ steps.bump-version.outputs.new-version }}"
          git checkout -b "$BRANCH_NAME"
          git add pyproject.toml uv.lock
          git commit -m "chore: bump version to ${{ steps.bump-version.outputs.new-version }}"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --title "chore: bump version to ${{ steps.bump-version.outputs.new-version }}" \
            --body "Automated version bump to ${{ steps.bump-version.outputs.new-version }}, triggered by the \`${{ steps.detect-bump.outputs.bump_type }}\` label on #${{ github.event.pull_request.number }}." \
            --base main \
            --head "$BRANCH_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
