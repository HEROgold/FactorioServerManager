name: Bump Version By Labels

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions: {}

jobs:
  bump-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # bump-by-label pushes the bump branch itself; give it an authenticated
      # remote explicitly instead of leaving checkout's credentials persisted
      # (which would apply to every subsequent step, not just this push).
      - name: Configure authenticated git remote for the bump push
        run: git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.*"

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "latest"

      - name: Bump by labels
        uses: herogold/bump-by-label@0d7cfd05d8418971b55596b690742ddb37fd46ff # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          command: "uv version --bump"
          validate: "uv version"
          base_branch: main
