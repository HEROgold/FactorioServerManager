name: Auto-release

on:
  workflow_run:
    workflows: ["Skylos Analysis"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

jobs:
  new-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      version_changed: ${{ steps.version-check.outputs.version_changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for tag comparison

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Check if version changed
        id: version-check
        run: |
          CURRENT_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          if git tag --list | grep -q "^v$CURRENT_VERSION$"; then
            echo "version_changed=false" >> $GITHUB_OUTPUT
            echo "Version v$CURRENT_VERSION already exists as a tag"
          else
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "New version v$CURRENT_VERSION detected - will create release"
          fi

      - name: Create GitHub Release
        if: steps.version-check.outputs.version_changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version-check.outputs.current_version }}
          name: Release v${{ steps.version-check.outputs.current_version }}
          draft: false
          prerelease: false
          generate_release_notes: true

      # Requires repo secrets SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT
      # (same convention already used for the app's runtime SENTRY_DSN, but this
      # is a separate org-level auth token scoped to release creation only).
      - name: Create Sentry release
        if: steps.version-check.outputs.version_changed == 'true'
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          version: ${{ steps.version-check.outputs.current_version }}
          environment: production

      - name: Trigger deploy workflow
        if: steps.version-check.outputs.version_changed == 'true'
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: new-release-created
          client-payload: '{"version": "${{ steps.version-check.outputs.current_version }}"}'
