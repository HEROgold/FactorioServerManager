name: Auto-release

# Skylos flags this trigger as chaining a privileged token from a
# potentially attacker-influenced workflow - accepted here: the
# `branches: [main]` filter below matches that trigger's head_branch, which
# for a fork's pull_request run is that fork's branch name, never "main".
# So this only ever fires for a check's push-triggered run on the
# already-merged, already-protected main branch - never for a PR's run,
# fork or not. This is the same pattern as HEROgold/confkit's release.yml.
# Each check below triggers this workflow when it completes. Only the run that
# finds all of them succeeded releases; the earlier ones stop at the gate.
# Keep the list here and REQUIRED_WORKFLOWS below in step.
on:
  # skylos: ignore[SKY-D290]
  workflow_run:
    workflows: ["Skylos Analysis", "Tests", "Droast Dockerfile Lint"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

permissions: {}

jobs:
  new-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment: release # scopes SENTRY_* secrets below to a dedicated environment
    # Two checks finishing together start two runs. One at a time, so the second
    # sees the tag the first one created and releases nothing.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read # to query sibling workflow-run conclusions below
    outputs:
      version_changed: ${{ steps.version-check.outputs.version_changed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed for tag comparison
          persist-credentials: false # this job never pushes; tags/release use the API instead

      - name: Verify all required checks passed for this commit
        id: gate
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Keep in step with `on.workflow_run.workflows` above.
          REQUIRED_WORKFLOWS=("Skylos Analysis" "Tests" "Droast Dockerfile Lint")
          for wf in "${REQUIRED_WORKFLOWS[@]}"; do
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&event=push" \
              --jq ".workflow_runs[] | select(.name == \"$wf\") | .conclusion // \"\"" | head -n1)
            echo "Required workflow '$wf': ${conclusion:-still running or not started}"
            if [ -z "$conclusion" ]; then
              # That check's own completion starts this workflow again.
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$conclusion" != "success" ]; then
              echo "::error::Required workflow '$wf' has not succeeded for $HEAD_SHA"
              exit 1
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.ready == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.ready == 'true'
        run: uv python install 3.14

      - name: Check if version changed
        id: version-check
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.ready == 'true'
        run: |
          CURRENT_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          if git tag --list | grep -q "^v$CURRENT_VERSION$"; then
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            echo "Version v$CURRENT_VERSION already exists as a tag"
          else
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "New version v$CURRENT_VERSION detected - will create release"
          fi

      - name: Create GitHub Release
        if: steps.version-check.outputs.version_changed == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version-check.outputs.current_version }}
          name: Release v${{ steps.version-check.outputs.current_version }}
          draft: false
          prerelease: false
          generate_release_notes: true

      # Requires environment secrets SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT
      # on the "release" environment (separate from the app's own SENTRY_DSN,
      # which is already wired in src/api/main.py).
      - name: Create Sentry release
        if: steps.version-check.outputs.version_changed == 'true'
        uses: getsentry/action-release@6fb9aeade7061441cf3864e34fbe11a1457ad7dc # v3.7.1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          version: ${{ steps.version-check.outputs.current_version }}
          environment: production

      - name: Trigger deploy workflow
        if: steps.version-check.outputs.version_changed == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: new-release-created
          client-payload: '{"version": "${{ steps.version-check.outputs.current_version }}"}'
