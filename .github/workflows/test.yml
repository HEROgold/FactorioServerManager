name: Tests

# release.yml waits for this workflow by name, so keep the name in step there.
"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Install the locked dependencies
        run: uv sync --locked

      # coverage.toml sets fail_under, so a drop in coverage fails the run.
      - name: Run the tests with coverage
        run: uv run pytest --cov --cov-config=coverage.toml --cov-report=term
