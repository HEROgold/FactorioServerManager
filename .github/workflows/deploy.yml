name: Deploy

# Needs, in the repository settings:
#   - variable DEPLOY_URL: the deploy-verifier hook, https://deploy.herogold.nl/hooks/fsm
#   - environment "production" (pinned by the verifier; its protection rules gate the deploy)
# The server side is in deploy/README.md.
on:
  repository_dispatch:
    types: [new-release-created]
  workflow_dispatch:

permissions: {}

jobs:
  # Build both images from the release tag and push them to GHCR. The outputs
  # are digest-pinned refs, so the server runs exactly what this job built.
  # The VPS verifier's image_pattern for [apps.fsm] pins the backend name, so
  # renaming an image means changing that config too.
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
      backend_image: ghcr.io/herogold/factorioservermanager-backend@${{ steps.backend.outputs.digest }}
      frontend_image: ghcr.io/herogold/factorioservermanager-frontend@${{ steps.frontend.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # A release builds its own tag. A manual run builds the default branch.
          ref: ${{ github.event.client_payload.version && format('v{0}', github.event.client_payload.version) || '' }}
          persist-credentials: false

      # Only a release gets a v<version> tag, so a manual run never moves one.
      # The version output is that tag, or sha-<commit> for a manual run.
      - name: Resolve version and commit
        id: version
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.version }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ -n "$RELEASE_VERSION" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version=sha-$sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.backend
          # Matches FSM_UID/FSM_GID in the server's .env and the host data-dir ownership.
          build-args: |
            FSM_UID=10001
            FSM_GID=10001
          push: true
          tags: |
            ${{ steps.version.outputs.release == 'true' && format('ghcr.io/herogold/factorioservermanager-backend:{0}', steps.version.outputs.version) || '' }}
            ghcr.io/herogold/factorioservermanager-backend:sha-${{ steps.version.outputs.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src/frontend
          push: true
          tags: |
            ${{ steps.version.outputs.release == 'true' && format('ghcr.io/herogold/factorioservermanager-frontend:{0}', steps.version.outputs.version) || '' }}
            ghcr.io/herogold/factorioservermanager-frontend:sha-${{ steps.version.outputs.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Notify the VPS through deploy-notifier with a GitHub OIDC token. The
  # verifier checks the token's repository and environment and the backend
  # against its image_pattern, then runs deploy-fsm.sh, which checks the
  # frontend image itself.
  # The "production" environment's required reviewers gate this job. To drop
  # the gate once the pipeline is trusted, remove those protection rules and
  # keep the environment. The verifier pins its name, so a run from another
  # environment gets a 403.
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://factorio.herogold.nl
    concurrency: deploy-production
    permissions:
      id-token: write # deploy-notifier authenticates with a GitHub OIDC token
    steps:
      - name: Notify the server
        uses: HEROgold/deploy-notifier@916bbfab11a60e4e68ee8f7eff69f2149ed5fe9f # v1
        with:
          url: ${{ vars.DEPLOY_URL }}
          image: ${{ needs.publish.outputs.backend_image }}
          version: ${{ needs.publish.outputs.version }}
          extra: '{"frontend_image": "${{ needs.publish.outputs.frontend_image }}"}'
          timeout: 900 # the verifier's [apps.fsm] timeout

      # Traefik can take a moment to route to the new frontend container, so
      # allow a short window before failing.
      - name: Smoke test
        run: |
          set -u
          for attempt in $(seq 1 12); do
            status=$(curl --silent --output /dev/null --max-time 10 --write-out "%{http_code}" https://factorio.herogold.nl/ || true)
            if [ "$status" = 200 ]; then
              echo "factorio.herogold.nl responded with 200"
              exit 0
            fi
            echo "attempt $attempt: status $status"
            sleep 10
          done
          echo "::error::factorio.herogold.nl did not respond with 200"
          exit 1
