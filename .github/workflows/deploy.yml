name: Deploy

# Redeploy FSM to the production host on every push to main. The runner joins
# the tailnet (ephemeral node) and runs the deploy over Tailscale SSH — no SSH
# keys and no public admin ports on the host.
#
# Required repo config:
#   Secrets:   TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET   (Tailscale OAuth client)
#   Variables: DEPLOY_HOST (host's MagicDNS name), DEPLOY_USER (SSH user on host)
# Host prerequisites:
#   - `tailscale up --ssh` enabled
#   - tailnet ACL granting `tag:ci` SSH access to DEPLOY_HOST as DEPLOY_USER
#   - the repo checked out at ~/FactorioServerManager with a filled-in .env (see README)

"on":
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Connect to tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy over Tailscale SSH
        run: |
          tailscale ssh "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" 'bash ~/FactorioServerManager/deploy.sh'
