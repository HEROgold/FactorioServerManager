name: Deploy

on:
  repository_dispatch:
    types: [new-release-created]
  workflow_dispatch:

permissions: {}

jobs:
  # Single job so the "production" environment's required-reviewer gate is
  # requested exactly once, and the secrets below (scoped to this same
  # environment) become available only after that approval. Remove the
  # `environment:` line later to drop the gate once the pipeline is trusted
  # (see RUNBOOK.md).
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions: {}
    steps:
      - name: Log deploy trigger
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.version || 'manual dispatch' }}
        run: |
          echo "Deploying: $RELEASE_VERSION"

      - name: Connect to tailnet
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }} # Tailscale hostname, e.g. ubuntu-4gb-hel1-1
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/FactorioServerManager
            ./deploy.sh

      - name: Smoke test
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://factorio.herogold.nl/)
          echo "factorio.herogold.nl responded with $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "::error::Smoke test failed with status $STATUS"
            exit 1
          fi
