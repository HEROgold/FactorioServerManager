name: Deploy

on:
  repository_dispatch:
    types: [new-release-created]
  workflow_dispatch:

permissions: {}

jobs:
  # Build both images from the release tag and push them to GHCR. The outputs
  # are digest-pinned refs, so the server runs exactly what this job built.
  # The VPS verifier's image_pattern for [apps.fsm] pins the backend name, so
  # renaming an image means changing that config too.
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
      backend_image: ghcr.io/herogold/factorioservermanager-backend@${{ steps.backend.outputs.digest }}
      frontend_image: ghcr.io/herogold/factorioservermanager-frontend@${{ steps.frontend.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # A release builds its own tag. A manual run builds the default branch.
          ref: ${{ github.event.client_payload.version && format('v{0}', github.event.client_payload.version) || '' }}
          persist-credentials: false

      # Only a release gets a v<version> tag, so a manual run never moves one.
      # The version output is that tag, or sha-<commit> for a manual run.
      - name: Resolve version and commit
        id: version
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.version }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ -n "$RELEASE_VERSION" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version=sha-$sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.backend
          # Matches FSM_UID/FSM_GID in the server's .env and the host data-dir ownership.
          build-args: |
            FSM_UID=10001
            FSM_GID=10001
          push: true
          tags: |
            ${{ steps.version.outputs.release == 'true' && format('ghcr.io/herogold/factorioservermanager-backend:{0}', steps.version.outputs.version) || '' }}
            ghcr.io/herogold/factorioservermanager-backend:sha-${{ steps.version.outputs.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src/frontend
          push: true
          tags: |
            ${{ steps.version.outputs.release == 'true' && format('ghcr.io/herogold/factorioservermanager-frontend:{0}', steps.version.outputs.version) || '' }}
            ghcr.io/herogold/factorioservermanager-frontend:sha-${{ steps.version.outputs.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Single job so the "production" environment's required-reviewer gate is
  # requested exactly once, and the secrets below (scoped to this same
  # environment) become available only after that approval. Remove the
  # `environment:` line later to drop the gate once the pipeline is trusted
  # (see RUNBOOK.md).
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions: {}
    steps:
      - name: Log deploy trigger
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          BACKEND_IMAGE: ${{ needs.publish.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.publish.outputs.frontend_image }}
        run: |
          echo "Deploying: $RELEASE_VERSION"
          echo "backend:  $BACKEND_IMAGE"
          echo "frontend: $FRONTEND_IMAGE"

      - name: Connect to tailnet
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/FactorioServerManager
            ./deploy.sh

      - name: Smoke test
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://factorio.herogold.nl/)
          echo "factorio.herogold.nl responded with $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "::error::Smoke test failed with status $STATUS"
            exit 1
          fi
