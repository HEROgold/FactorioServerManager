name: Droast Dockerfile Lint

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  droast:
    name: Droast Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache droast binary
        id: cache-droast
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/droast
          key: droast-${{ runner.os }}-1.4.8

      # The crate is published as `dockerfile-roast`; it installs a `droast` binary.
      - name: Install droast
        if: steps.cache-droast.outputs.cache-hit != 'true'
        run: cargo install dockerfile-roast --version 1.4.8 --locked

      # Lints the Dockerfiles, respecting droast.toml (which now skips only DF020;
      # DF005/DF007/DF012 are fixed at the source). droast exits non-zero on
      # ERROR-severity findings, which fails this job.
      - name: Run droast
        run: droast --format github Dockerfile.backend src/frontend/Dockerfile
