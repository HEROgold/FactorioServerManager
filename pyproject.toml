[project]
name = "fsm"
version = "0.2.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HEROgold" }
]
requires-python = ">=3.14"
dependencies = [
    "httpxyz>=0.31.2",
    "h2>=4.4.1",
    "beautifulsoup4>=4.14.3",
    "confkit>=1.3.1",
    "cryptography>=50.0.0",
    "sqlalchemy>=2.0.48",
    "docker>=7.1.0",
    "kubernetes>=31.0.0",
    "sentry-sdk>=2.57.0",
    "fastapi>=0.135.3",
    "herogold>=2.0.2",
    "uvicorn>=0.44.0",
    "email-validator>=2.0.0",
    "pydantic>=2.13.4",
    "pyjwt[crypto]>=2.14.0",
]

[dependency-groups]
dev = [
    "ty>=0.0.55",
    "pyrefly>=1.1.1",
    "types-docker>=7.1.0",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "api"
module-root = "src"

[tool.ty.environment]
python-version = "3.14"
root = ["src"]

[tool.ty.terminal]
# Treat warnings as hard failures so nothing slips through.
error-on-warning = true

[tool.ty.rules]
# Strictest: escalate optional/implicit issues to errors.
possibly-unresolved-reference = "error"
redundant-cast = "error"
unused-ignore-comment = "error"

[tool.pyrefly]
project-includes = ["src/api"]
search-path = ["src"]
python-version = "3.14"
# Strictest behaviour: type-check untyped defs and infer their return types.
untyped-def-behavior = "check-and-infer-return-type"

[tool.pyrefly.errors]
implicit-import = true

[tool.skylos]
complexity = 10
nesting = 3
max_args = 5
max_lines = 50
god_file_max_lines = 500
god_file_max_definitions = 40
god_file_max_top_level_definitions = 25
duplicate_strings = 3
model = "gpt-4.1"
# Head.tsx's only content of note is a CDN <script>'s Subresource Integrity
# hash (a public, base64-encoded sha384 digest, not a secret). Skylos's
# TypeScript secret scanner has no field-name allowlist for `integrity=`
# attributes (unlike its Python scanner) and no per-line suppression for
# SKY-S101, so this tiny, non-logic file is excluded outright rather than
# disabling the rule project-wide.
exclude = ["src/frontend/src/components/Head.tsx"]
ignore = [
    # Flags any call to a method literally named `read`/`readlines`,
    # regardless of receiver type, so it fires on our JsonParser/settings
    # wrapper methods (e.g. `parser.read(file)`) that never load unbounded
    # data. The handful of genuine raw file reads in this codebase (log
    # tails, JSON config) are hardened directly with symlink/size-cap
    # guards instead (see SKY-D325).
    "SKY-P401",
    # Only recognizes mypy/pyright ([tool.mypy]/[tool.pyright],
    # mypy.ini/pyrightconfig.json). This project's checked type policy is
    # `ty` + `pyrefly` (see [tool.ty]/[tool.pyrefly] below), configured with
    # errors escalated to failures - an equivalent policy the rule can't see.
    "SKY-R101",
]

[tool.skylos.masking]
names = []
decorators = []
bases = []

[tool.skylos.dead_code]
entrypoints = []

# [[tool.skylos.dead_code.entrypoints]]
# type = "class"
# name = "Main"
# path = "**/main.py"
# base_classes = ["Application"]
# reason = "framework entrypoint"
#
# [[tool.skylos.dead_code.entrypoints]]
# type = "method"
# name = ["create", "pre_hook", "post_hook"]
# parent = { name = "Main", base_classes = ["Application"] }
# reason = "framework lifecycle method"

[tool.skylos.templates]
# security = ".skylos/templates/security.md"
# quality = ".skylos/templates/quality.md"
# security_audit = ".skylos/templates/security_audit.md"
# review = ".skylos/templates/review.md"

[tool.skylos.vibe]
extra_phantom_names = []
extra_phantom_decorators = []
extra_credential_names = []
extra_sensitive_file_keywords = []
extra_network_timeout_calls = []

[tool.skylos.architecture]
strict = false
# Q802/Q803 are file-level I/A/D architecture signals by default. Set this to
# true only if those signals should block strict gates in this project.
enforce_iad = false

# [[tool.skylos.architecture.layers]]
# name = "api"
# patterns = ["app.api", "app.routes"]
#
# [[tool.skylos.architecture.layers]]
# name = "domain"
# patterns = ["app.domain", "app.models"]
#
# [[tool.skylos.architecture.rules]]
# from = "domain"
# deny = ["api"]

[tool.skylos.whitelist]
names = []

[tool.skylos.whitelist.documented]

[tool.skylos.whitelist.temporary]

[tool.skylos.gate]
fail_on_critical = true
max_critical = 0 
max_high = 5
max_security = 0
max_quality = 10
strict = false
