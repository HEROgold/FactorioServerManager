# Production stack: FSM behind an EXISTING Traefik reverse proxy.
#
# Routing model (single origin, no CORS): Traefik points ONLY at the frontend
# (Bun, :3000). The frontend serves the SPA and proxies /api/* to the backend
# over the internal network, so the backend is never exposed to Traefik.
#
# Copy .env.prod.example -> .env and fill it in first. See README (Deployment).
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build

services:
  # Least-privilege gateway to the host Docker daemon. The backend talks to
  # THIS instead of mounting the raw socket, so a compromise of the backend
  # cannot run arbitrary Docker API calls (raw socket access is host-root
  # equivalent). Only the container/image operations FSM needs are allowed.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    networks:
      - internal
    environment:
      # Allow the endpoints DockerBackend uses: create/start/stop/restart/remove
      # containers and pull images. Everything else stays denied by default.
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        # Single knob for the service uid/gid: build the image, run the app, and
        # PUID/PGID the spawned Factorio containers all from these. Keep in sync
        # with scripts/setup-host.sh and the host data-dir ownership.
        FSM_UID: ${FSM_UID:-10001}
        FSM_GID: ${FSM_GID:-10001}
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    networks:
      - internal
    # The container starts as root so docker-entrypoint.sh can chown the
    # bind-mounted data to FSM_UID:FSM_GID (healing legacy/foreign ownership),
    # then drops to that unprivileged user via gosu — so the app process is never
    # root. No `user:` override (that would prevent the entrypoint chown), and no
    # `no-new-privileges` (it blocks the setuid gosu needs). Caps are dropped to
    # ALL then only the minimal set for chown + privilege-drop is added back.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN         # chown -R the data tree
      - DAC_OVERRIDE  # read/traverse files owned by other uids while reconciling
      - FOWNER        # chmod/operate on those files regardless of owner
      - SETUID        # gosu drop to fsm
      - SETGID        # gosu drop to fsm
    environment:
      # Secret keys are read from the environment (fall back to on-disk key
      # files only if unset). Keep these in .env, never in the image.
      FSM_SECRET_KEY: ${FSM_SECRET_KEY}
      FSM_TOKEN_KEY: ${FSM_TOKEN_KEY}
      # Drive the daemon through the scoped proxy, never the raw socket.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    volumes:
      # Prod AppConfig (public_ip, server_backend). confkit rewrites this file
      # in place at import, so it must be a writable host bind, not read-only.
      - ./config.ini:/app/src/api/config.ini
      # Persistence. The servers dir uses an IDENTICAL host:container path: the
      # backend hands spec.data_dir (an in-container path) to the host daemon,
      # which resolves it on the host filesystem — the paths must match.
      - /app/src/api/servers:/app/src/api/servers
      - /app/src/api/saves:/app/src/api/saves
      - /app/src/api/downloads:/app/src/api/downloads
      # SQLite DB as a single-file bind (touch the host file first, else Docker
      # creates a directory in its place).
      - /app/src/api/database.db:/app/src/api/database.db
    healthcheck:
      # The slim image has no curl; probe with the bundled Python instead.
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: src/frontend
      dockerfile: Dockerfile
    # Override the image's dev CMD: run the production Bun server (no HMR).
    command: ["bun", "run", "start"]
    restart: unless-stopped
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik
      - internal
    environment:
      # The Bun server proxies /api/* to this in-network backend service.
      API_TARGET: http://backend:8000
    labels:
      - traefik.enable=true
      # If the shared Traefik network isn't the container's only network,
      # Traefik needs to be told which one to use to reach this service.
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.fsm.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`)
      # Entrypoint + certresolver names match the existing n8n Traefik (v3.6):
      # web(:80, auto-redirects to https), websecure(:443), TLS-ALPN resolver.
      - traefik.http.routers.fsm.entrypoints=web,websecure
      - traefik.http.routers.fsm.tls=true
      - traefik.http.routers.fsm.tls.certresolver=mytlschallenge
      - traefik.http.services.fsm.loadbalancer.server.port=3000

networks:
  # The existing network that Traefik is attached to (e.g. n8n_default).
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
  # Private backend<->frontend link, not reachable from Traefik.
  internal:
    driver: bridge
