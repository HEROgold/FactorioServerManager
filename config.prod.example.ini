# Production AppConfig for FSM. Copy to `config.ini` on the host (next to
# docker-compose.prod.yml) and set `public_ip`. This file is bind-mounted over
# /app/src/api/config.ini; confkit rewrites it in place at startup, so it lives
# on the host (not baked into the image) to persist edits.
[AppConfig]
require_game_ownership = False
# The address players use to connect. MUST be the server's public IP (or the
# public hostname's resolved IP), not 127.0.0.1 — it is shown in the UI as the
# server's connect address. (factorio.herogold.nl currently resolves here.)
public_ip = 123.456.789.012
rcon_port = 27015
# Host interface each server's RCON (TCP) port is published on. Defaults to
# loopback so RCON (arbitrary in-game/Lua console access) is never public. When
# the backend reaches servers over the network (containerised deploys), set this
# to a reachable, firewalled address that only the manager can hit.
rcon_bind_host = 127.0.0.1
# Comma-separated allowlist of emails permitted to log in. LEAVE EMPTY only for
# a trusted single-operator box: empty means any Factorio account can log in and
# gets full server-management rights. Set it to lock the manager down.
auth_allowed_emails =
# Inclusive range of game ports a user may request when creating a server.
lower_port_limit = 61616
upper_port_limit = 65535
# Spawn Factorio servers as sibling containers on the host Docker daemon.
server_backend = docker
k8s_namespace = default
factorio_image = factoriotools/factorio
mod_shared_root =
timeout_rcon = 5

[HTTPConfig]
timeout = 5
